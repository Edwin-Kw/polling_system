name: polling-system

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: polling
      POSTGRES_PASSWORD: polling_local_only
      POSTGRES_DB: polling
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polling -d polling"]
      interval: 2s
      timeout: 5s
      retries: 15

  app:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql://polling:polling_local_only@db:5432/polling
      HOST: 0.0.0.0
      PORT: "3000"
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
    init: true

  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      DATABASE_URL: postgresql://polling:polling_local_only@db:5432/polling
      NODE_ENV: test
    depends_on:
      db:
        condition: service_healthy
    init: true

volumes:
  postgres-data:
